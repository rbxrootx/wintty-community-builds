name: Build Wintty community release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Wintty branch, tag, or commit to build
        required: true
        default: windows
        type: string
      publish_release:
        description: Publish a GitHub prerelease (otherwise keep a workflow artifact only)
        required: true
        default: true
        type: boolean
  schedule:
    - cron: '17 9 * * 0'

concurrency:
  group: wintty-community-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 180
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\nuget-cache
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      PUBLISH_REQUESTED: ${{ github.event_name == 'schedule' || inputs.publish_release }}
    steps:
      - name: Check out builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out Wintty source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: deblasis/wintty
          ref: ${{ inputs.source_ref || 'windows' }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Identify source and existing release
        id: source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = (git -C source rev-parse HEAD).Trim().ToLowerInvariant()
          if ($sha -notmatch '^[0-9a-f]{40}$') { throw "Unexpected source SHA: $sha" }
          $short = $sha.Substring(0, 12)
          $tag = "upstream-$short"
          $publish = $env:PUBLISH_REQUESTED -eq 'true'
          $releases = gh release list --repo $env:GITHUB_REPOSITORY --json tagName --limit 1000 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exists = @($releases | Where-Object { $_.tagName -eq $tag }).Count -gt 0
          $skip = $publish -and $exists
          "sha=$sha" >> $env:GITHUB_OUTPUT
          "short=$short" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "skip=$($skip.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($skip) { Write-Host "Release $tag already exists; no rebuild needed." }

      - name: Install Zig 0.16.0
        if: steps.source.outputs.skip != 'true'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Install .NET SDK 10.0.401
        if: steps.source.outputs.skip != 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401

      - name: Build release libghostty
        if: steps.source.outputs.skip != 'true'
        working-directory: source
        shell: pwsh
        run: |
          zig build -Dapp-runtime=none -Doptimize=ReleaseFast
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build solution with committed NuGet locks
        if: steps.source.outputs.skip != 'true'
        working-directory: source
        shell: pwsh
        run: |
          dotnet build windows/Ghostty.sln /p:Platform=x64 /p:Configuration=Release /p:RestoreLockedMode=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish self-contained NativeAOT app
        if: steps.source.outputs.skip != 'true'
        working-directory: source
        shell: pwsh
        run: |
          $published = Join-Path $env:GITHUB_WORKSPACE 'published'
          # The source lock files do not include win-x64 RID metadata. This
          # disposable checkout can restore that metadata for NativeAOT.
          dotnet publish windows/Ghostty/Ghostty.csproj -c Release -r win-x64 --self-contained true /p:Platform=x64 /p:RestoreLockedMode=false -o $published
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path (Join-Path $published 'Wintty.exe'))) { throw 'Missing Wintty.exe' }
          if (-not (Test-Path (Join-Path $published 'native\ghostty.dll'))) { throw 'Missing ghostty.dll' }
          if (Test-Path (Join-Path $published 'Wintty.runtimeconfig.json')) { throw 'Publish is not self-contained NativeAOT' }

      - name: Package portable ZIP and installer
        if: steps.source.outputs.skip != 'true'
        shell: pwsh
        run: |
          $candidates = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue)?.Source }
          if (-not $iscc) { throw 'Inno Setup 6 ISCC.exe is missing from the runner.' }
          ./scripts/Package.ps1 -SourceDir ./source -PublishedDir ./published -OutputDir ./artifacts -SourceSha '${{ steps.source.outputs.sha }}' -IsccPath $iscc

      - name: Save workflow artifact
        if: steps.source.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wintty-community-${{ steps.source.outputs.short }}-x64
          path: |
            artifacts/*.zip
            artifacts/*.exe
            artifacts/SHA256SUMS.txt
            artifacts/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub prerelease
        if: steps.source.outputs.skip != 'true' && steps.source.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $short = '${{ steps.source.outputs.short }}'
          $files = @(
            "artifacts/Wintty-community-$short-x64.zip",
            "artifacts/Wintty-community-$short-x64-setup.exe",
            'artifacts/SHA256SUMS.txt'
          )
          gh release create '${{ steps.source.outputs.tag }}' @files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Wintty community build $short" --notes-file artifacts/RELEASE_NOTES.md --prerelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
